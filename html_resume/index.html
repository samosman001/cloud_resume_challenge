    <p>Total Visitors: <span id="counter">Loading...</span></p>

    <script>
        // Replace with your live API Gateway Invoke URL
        const API_URL = "https://t2bcidzga5.execute-api.us-east-2.amazonaws.com/dev";

        async function fetchVisitorCount() {
            const counterElement = document.getElementById("counter");
            
            try {
                const response = await fetch(API_URL, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    }
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! Status: ${response.status}`);
                }

                const rawData = await response.json();
                console.log("Raw API Response Data:", rawData); // This lets us see exactly what AWS sent

                // Handle BOTH standard format or Lambda proxy format dynamically
                let finalCount;
                if (rawData.body) {
                    // If API Gateway passed the response string wrapped inside a body key
                    const parsedBody = typeof rawData.body === 'string' ? json.parse(rawData.body) : rawData.body;
                    finalCount = parsedBody.count;
                } else {
                    // If it returned a direct JSON object
                    finalCount = rawData.count;
                }

                if (finalCount !== undefined) {
                    counterElement.innerText = finalCount;
                } else {
                    throw new Error("Could not locate 'count' key in the API response properties.");
                }

            } catch (error) {
                // This prints the exact reason why it says 'Unavailable' to your developer tools
                console.error("Failed to update visitor count:", error);
                counterElement.innerText = "Unavailable";
            }
        }

        document.addEventListener("DOMContentLoaded", fetchVisitorCount);
    </script>
