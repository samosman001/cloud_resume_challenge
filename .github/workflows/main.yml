name: Deploy Static Website to S3 (No Git, No Node)

on:
  push:
    branches:
      - main

# Explicitly allow the workflow to read repository contents (Crucial for private repos)
permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    container:
      image: amazon/aws-cli:latest

    steps:
    # 1. Download and extract code directly into an isolated folder
    - name: Download Repository Archive
      run: |
        yum install -y tar gzip
        
        # Notice the exact URL starts with api.github.com
        curl -L -f -s \
          -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
          "https://github.com/${{ github.repository }}/tarball" \
          -o source.tar.gz
          
        mkdir site-build
        tar -xzf source.tar.gz -C site-build --strip-components=1
        rm source.tar.gz

    # 2. Sync ONLY the contents of the isolated folder to S3
    - name: Deploy to S3 Bucket
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        AWS_DEFAULT_REGION: us-east-1 # Change to your bucket's AWS region
      run: |
        aws s3 sync ./site-build s3://${{ secrets.AWS_S3_BUCKET }} \
          --delete \
          --exclude ".git/*" \
          --exclude ".github/*" \
          --exclude "README.md"
