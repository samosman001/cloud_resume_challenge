name: Deploy Static Website to S3 (No Node)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    container:
      image: amazon/aws-cli:latest

    steps:
    # 1. Clear out the workspace and fetch the repository code cleanly using native Git
    - name: Checkout Code Natively
      run: |
        yum install -y git
        # Mark the current directory as safe so Git doesn't complain about ownership ownership permissions
        git config --global --add safe.directory /${{ github.event.repository.name }}
        
        # Initialize and pull the code manually
        git init
        git remote add origin https://github.com/${{ github.repository }}.git
        git fetch --depth=1 origin ${{ github.sha }}
        git checkout FETCH_HEAD

    # 2. Sync directly to S3 using the environment variables for authentication
    - name: Deploy to S3 Bucket
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        AWS_DEFAULT_REGION: us-east-2 # Change to your bucket's AWS region
      run: |
        aws s3 sync . s3://${{ secrets.AWS_S3_BUCKET }} \
          --delete \
          --exclude ".git/*" \
          --exclude ".github/*" \
          --exclude "README.md"
