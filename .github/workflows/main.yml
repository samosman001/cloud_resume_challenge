name: Deploy Static Website to S3 (No Git, No Node)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    # 1. Download and extract the code in the native Ubuntu environment
    - name: Download Repository Archive
      run: |
        curl -L -f -s \
          -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
          "https://github.com/${{ github.repository }}/tarball" \
          -o source.tar.gz
          
        mkdir site-build
        tar -xzf source.tar.gz -C site-build --strip-components=1
        rm source.tar.gz

    # 2. Spin up the AWS container to handle the sync step natively
    - name: Deploy to S3 Bucket
      uses: docker://amazon/aws-cli:latest
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        AWS_DEFAULT_REGION: us-east-2
      with:
        args: >-
          s3 sync ./site-build s3://${{ secrets.AWS_S3_BUCKET }}
          --delete
          --exclude ".git/*"
          --exclude ".github/*"
          --exclude "README.md"
