name: Deploy Static Website to S3 (No Git, No Node)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    container:
      image: amazon/aws-cli:latest

    steps:
    # 1. Download and extract code directly into an isolated folder
    - name: Download Repository Archive
      run: |
        yum install -y tar gzip
        
        # Added -f to crash here if the URL is wrong, and updated the URL structure
        curl -L -f -s \
          -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
          https://github.com/${{ github.repository }}/tarball \
          -o source.tar.gz
          
        mkdir site-build
        tar -xzf source.tar.gz -C site-build --strip-components=1
        rm source.tar.gz

    # 2. Sync directly to S3 using the environment variables for authentication
    - name: Deploy to S3 Bucket
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        AWS_DEFAULT_REGION: us-east-2 # Change to your bucket's AWS region
      run: |
        aws s3 sync . s3://${{ secrets.AWS_S3_BUCKET }} \
          --delete \
          --exclude ".git/*" \
          --exclude ".github/*" \
          --exclude "README.md"
