name: Deploy Static Website to S3 (No Git, No Node)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    container:
      image: amazon/aws-cli:latest

    steps:
    # 1. Download and extract the code archive via GitHub's API (Bypassing Git entirely)
    - name: Download Repository Archive
      run: |
        yum install -y tar
        
        # Download the main branch source code as a tarball using GitHub's native archive link
        curl -L -s \
          -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
          https://github.com${{ github.repository }}/tarball/main \
          -o source.tar.gz
          
        # Extract the files and strip the top-level GitHub-generated folder wrapper
        mkdir workspace
        tar -xzf source.tar.gz -C workspace --strip-components=1
        
        # Move extracted files into the current working directory
        mv workspace/* workspace/.[!.]* . 2>/dev/null || true
        rm -rf workspace source.tar.gz

    # 2. Sync directly to S3 using the environment variables for authentication
    - name: Deploy to S3 Bucket
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        AWS_DEFAULT_REGION: us-east-2 # Change to your bucket's AWS region
      run: |
        aws s3 sync . s3://${{ secrets.AWS_S3_BUCKET }} \
          --delete \
          --exclude ".git/*" \
          --exclude ".github/*" \
          --exclude "README.md"
