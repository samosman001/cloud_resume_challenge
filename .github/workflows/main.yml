name: Deploy Static Website to S3

on:
  push:
    branches:
      - main # Triggers the look whenever you push to the main branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    # 1. Pull the code from your repository into the runner
    - name: Checkout Repository
      uses: actions/checkout@v4

    # 2. Authenticate securely with AWS using your GitHub Secrets
    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1 # Change to your bucket's AWS region

    # 3. Sync the files natively using the AWS CLI
    - name: Deploy to S3 Bucket
      run: |
        aws s3 sync . s3://${{ secrets.AWS_S3_BUCKET }} \
          --delete \
          --exclude ".git/*" \
          --exclude ".github/*" \
          --exclude "README.md"
